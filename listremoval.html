<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <ul id="list">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>C++</li>
        <li>SQL</li>
    </ul>
    <button onclick="removal()">Remove Last Element</button>
    <p id="display"></p>
</body>
<script>
    function removal() {
        list = document.getElementById('list')
        x = document.getElementById('list').lastElementChild
        if (x) {
            list.removeChild(x)
        }
        else
        {
            document.getElementById('display').innerHTML = 'All Clear'
        }
    }
</script>

</html>
