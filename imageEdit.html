<script>
    function blur1() {
        console.log('1')
        document.getElementById('img1').style.filter = "blur(50px)"
    }
    function grey1()
    {
        document.getElementById('img1').style.filter = "grayscale(50%)"
    }
    function Bright1()
    {
        document.getElementById('img1').style.filter = "brightness(150%)"
    }
    function contrast1()
    {
        document.getElementById('img1').style.filter = "contrast(40px)"
    }
</script>
