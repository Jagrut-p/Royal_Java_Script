<html>
    <head>

    </head>
    <body>
        <button onkeypress="keyprss()">Key Press</button>
        <button onkeydown="keydown()">Key Down</button>\
        <button onkeyup="keyup()">Key Up</button>
    </body>
    <script>
        function keyprss()
        {
            document.body.style.backgroundColor = 'salmon'
        }
        function keydown()
        {
            document.body.style.backgroundColor = 'green'
        }
        function keyup()
        {
            document.body.style.backgroundColor = 'blue'
        }
    </script>
</html>
