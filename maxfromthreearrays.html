<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="" name="form1">
        Enter array of No1: <input type="text" name="arr1">
        <input type="button" value="Submit" onclick="arra1()"><br><br>
        Enter array of No2: <input type="text" name="arr2" id="" onclick="">
        <input type="button" value="Submit" onclick="arra2()"><br><br>
        Enter array of No3: <input type="text" name="arr3" id="" onclick="">
        <input type="button" value="Submit" onclick="arra3()"><br><br>
        <input type="button" value="Display" onclick="display()">
        <input type="button" value="Max" onclick="max1()"><br><br>
        <input type="button" value="Array Max" onclick="arramax() ">
    
    </form>
    <p id="display1"></p><br>
    <p id="display2"></p><br>
    <p id="display3"></p><br>
    <p id="max1"></p><br>
    <p id="max2"></p><br>
    <p id="max3"></p><br>
    <p id="arraymax"></p>
    <script>
        let arr1 = [], arr2 = [], arr3 = [];
        function arra1() {
            ar1 = document.form1.arr1.value
            arr1.push(ar1)
        }
        function arra2() {
            ar2 = document.form1.arr2.value
            arr2.push(ar2)

        }
        function arra3() {
            ar3 = document.form1.arr3.value
            arr3.push(ar3)
        }
        function display() {
            document.getElementById('display1').innerHTML = arr1
            document.getElementById('display2').innerHTML = arr2
            document.getElementById('display3').innerHTML = arr3
        }
        let x, y, z, i;
        function max1() {
            x = arr1[0]
            y = arr2[0]
            z = arr3[0]
            for (i = 0; i < arr1.length; i++) {
                if (x < arr1[i]) {
                    x = arr1[i]
                }
            }
            for (i = 0; i < arr2.length; i++) {
                if (y < arr2[i]) {
                    y = arr2[i]
                }
            }
            for (i = 0; i < arr3.length; i++) {
                if (z < arr3[i]) {
                    z = arr3[i]
                }
            }
            document.getElementById('max1').innerHTML = "Max1: " + x
            document.getElementById('max2').innerHTML = "Max2: " + y
            document.getElementById('max3').innerHTML = "Max3: " + z
        }
        function arramax() {
            let a
            if (x > y && x > z) {
                a = x;
            }
            else if (y > x && y > z) {
                a = y;
            }
            else if (z > x && z > y) {
                a = z
            }
            document.getElementById('arraymax').innerHTML = "Max from all arrays" + a
        }
    </script>
</body>

</html>
