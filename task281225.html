<!-- 1. take value of n from user and print series
2. print only evens from series
3. display nos only divisible by 3 7 and 5
4. display fibbonacci seriers up to given iterations -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        n = parseInt(prompt("Enter a number till where you want it to be printed: "))
        for (i = 1; i < n; i++) 
        {
            document.writeln(i)
        }
        
    </script>
</body>

</html>
