<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="hide()">Hide ME</button>
    <button onclick="unhide()">Unhide Me</button>
    <div id="display"></div>
</body>
    <script>
        function hide()
        {
            document.getElementById('display').innerHTML = " "
        }
        function unhide()
        {
            document.getElementById('display').innerHTML = "Hide Me..."
        }
    </script>
</html>
