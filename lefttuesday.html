<html>
<style>
    a {
        text-decoration: none;
        color: black;
    }
</style>

<body>
    <p id="hello">HELLO</p>
    <button onclick="fo()">Click</button>
    <a id="li" href="http://netflix.com/">NETFLIX</a>
    <button onclick="lin()">Change Link</button>
</body>
<script>
    function fo() {
        document.getElementById('hello').innerHTML = '<font size="40px" color="red">HELLO</font>'
    }
    function lin() {
        document.getElementById('li').innerHTML = 'GOOGLE'
        document.getElementById("li").href = "https://www.google.com/"
    }
</script>

</html>
