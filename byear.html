<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    function birth() {
        dob = parseInt(document.Data.dob.value);
        cal = 2025 - dob;
        if (cal >= 18) {
            document.bgColor = "Red"
        }
        else {
            document.bgColor = "Green"
        }
    }
</script>

<body>
    <form action="" name="Data">
        Enter DOB: <input type="date" name="dob">
        <input type="button" value="Submit" onclick="birth()">
    </form>
</body>

</html>
