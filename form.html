<script>
    function launch() {
        e = document.form1.em.value
        p = document.form1.pa.value
        if (e == 'admin@gmail.com' && p == '123') {
            document.getElementById('display').innerHTML = '<div style="border:1px solid green; background-color: green; border-radius: 10px; height: 30px; width: 300px;  padding-left: 10px; padding-top: 12px; color: white;">Welcome Sucessfully Logged In</div>'  
            document.getElementById('em').style.cssText = "border: 1px solid green; background-color: rgba(71, 240, 71, 0.733)";

        }

            document.getElementById('display').innerHTML = '<div style="border:1px solid red; background-color: red; border-radius: 10px; height: 30px; width: 300px;  padding-left: 10px; padding-top: 12px; color: white;">Invalid User or Password </div>'  
            document.getElementById('em').style.cssText = "border: 1px solid red; background-color: rgba(255, 0, 0, 0.450)";  
            document.getElementById('pa').style.cssText = "border: 1px solid red; background-color: rgba(255, 0, 0, 0.450)";  


        }
    }
</script>
