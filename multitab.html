<!DOCTYPE html>
<html lang="en">
<!-- seen from gemini -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        num = parseInt(prompt("Enter a number to get table of it and one previous and forward one: "))
        for (i = num - 1; i <= num + 1; i++) 
        {
            for (k = 1; k <= 10; k++) 
            {
                document.writeln(i, " * ", k, " = ", k * i, "<br>")
            }
            document.writeln("<br>")
        } 
    </script>
</body>

</html>
