<!-- 1. take value of n from user and print series
2. print only evens from series
3. display nos only divisible by 3 7 and 5
4. display fibbonacci seriers up to given iterations 
3
3 & 7
5
7
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        i = parseInt(prompt("Enter a number: "))
        if (i % 3 == 0 && i % 7 == 0) {
            document.writeln("Divisible by 3 and 7: ", i)
            document.writeln("<br>")
        }
        else if (i % 3 == 0) {
            document.writeln("Divisible by 3: ", i, "<br>")
            document.writeln("<br>")
        }
        else if (i % 5 == 0) {
            document.writeln("Divisible by 5: ", i, "<br>")
            document.writeln("<br>")
        }
        else if (i % 7 == 0) {
            document.writeln("Divisible by 7: ", i, "<br>")
            document.writeln("<br>")
        }

    </script>
</body>

</html>
