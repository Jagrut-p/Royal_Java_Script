
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task</title>
</head>
<body onload="color()">
    <script>
        function color(){
            document.body.bgColor = 'violet'
            console.log('Violet')
            setTimeout(indigo,1500)
        }

        function indigo(){
            document.body.bgColor = 'indigo'
            console.log('Indigo')
            setTimeout(blue,1500)
        }

        function blue(){
            document.body.bgColor = 'blue'
            console.log('Blue')
            setTimeout(green,1500)
        }

        function green(){
            document.body.bgColor = 'green'
            console.log('Green')
            setTimeout(yellow,1500)
        }

        function yellow(){
            document.body.bgColor = 'yellow'
            console.log('Yellow')
            setTimeout(orange,1500)
        }

        function orange(){
            document.body.bgColor = 'orange'
            console.log('Orange')
            setTimeout(red,1500)
        }

        function red(){
            document.body.bgColor = 'red'
            console.log('Red')
            setTimeout(color,1500)
        }
    </script>
</body>
</html>
