<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Wonders Gallery</title>

    <style>
        body {
            margin: 0;
            background-color: antiquewhite;
            text-align: center;
        }

        .container {
            width: 500px;
            margin: 100px 425px;
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 8px 8px 20px gray;
        }

        h2 {
            margin-bottom: 15px;
            color: black;
        }

        .disp {
            height: 300px;
            width: 450px;
            object-fit: cover;
            border-radius: 12px;
            border: 3px solid lightgray;
        }

        button {
            margin-top: 20px;
            background-color: green;
            color: white;
            height: 40px;
            width: 180px;
            border-radius: 8px;
            font-size: 16px;
        }

    </style>
</head>

<body>

    <div class="container">
        <h2>World Wonders Gallery</h2>
        <img class="disp" src="taj.jpg" id="image">
        <br>
        <button onclick="clicked()">Change Image</button>
    </div>

    <script>
        let img = ["taj.jpg","itza.jpg","machu.jpg","wall.jpg","petra.jpg","christ.jpg","colo.jpg"];

        function clicked() {
            let x = Math.floor(Math.random() * img.length);
            document.getElementById("image").src = img[x];
        }
    </script>

</body>
</html>
