<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2</title>

    <style>
    body{
        margin: 0%;
        padding: 0%;
    }

    .disp{
        visibility: hidden;
    }

    .boxcss{
        visibility: visible;
        background-color: black;
        color: white;
        height: 100vh;
        width: 300px;
        z-index: 1;
    }

    button{
        position: absolute;
        top: 50px;
        left: 50px;
        height: 40px;
        width: 100px;
        z-index: 0;
    }
    </style>
</head>
<body>
    <div id="d1" class="disp" onclick="check('divi')">
        <div style=" padding: 30px; font-size: 22px;">Home</div>
        <div style="padding: 30px; font-size: 22px;">Product</div>
        <div style="padding: 30px; font-size: 22px;">About Us</div>
        <div style="padding: 30px; font-size: 22px;">Login</div>
    </div>
    <button onclick="check('button')" id="d2">Menu</button>

    <script>
        function check(vari)
        {
            if(vari=='button')
            {
                document.getElementById('d1').classList.add('boxcss')
                document.getElementById('d2').style.visibility="hidden"
            }else
            {
                document.getElementById('d1').classList.remove('boxcss')
                document.getElementById('d2').style.visibility="visible"
            }
        }
    </script>
</body>
</html>
