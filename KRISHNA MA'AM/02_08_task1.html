<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a= new Promise((passed,failed)=>
                {
                    let pass=false;
                    setTimeout(function()
                    {
                        if(pass)
                        {
                            passed("Pass")
                        }else
                        {
                            failed("Fail")
                        }
                    },1000)
                })

        a.then((msg)=>console.log(msg))
        
        a.catch((msg)=>console.log(msg))

        a.finally(function()
        {
            console.log("Check")
        })
    </script>
</body>
</html>
