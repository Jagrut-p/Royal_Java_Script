<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body onresize="resizeFun()">
    
    <p id="disp"></p>
    <script>
       function resizeFun()
       {
            document.getElementById("disp").innerHTML=`Inner Width : ${window.innerWidth} <br> Inner Height : ${window.innerHeight}
                                                        <br><br> Outer Width : ${window.outerWidth} <br> Outer Height : ${window.outerHeight}`
       }
    </script>
</body>
</html>
