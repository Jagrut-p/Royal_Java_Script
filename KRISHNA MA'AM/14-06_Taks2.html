
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .box{
            width: 300px;
            height: 100px;
            background-color: brown;
            margin: 30px;
            color: wheat;
            padding-top: 35px;
            text-align: center;
            font-size: 25px;
        }
    </style>
</head>
<body>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <button onclick="changeVal()">ClicK here</button>
    <script>
        function changeVal(){
            
            let boxes = document.getElementsByClassName('box')

            for(i=0;i<boxes.length;i++){
                boxes[i].innerHTML = "Hello"
            }



        }
    </script>
</body>
</html>
