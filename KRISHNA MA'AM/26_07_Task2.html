<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a=new Promise(function(resolve,reject)
        {
            let flag=false
            if(flag)
            {
                resolve()
            }else
            {
                reject()
            }
        })

        a.then(function()
        {
            console.log("Resolved")
        })
        a.catch(function()
        {
            
            console.log("Reject")
        })
    </script>
</body>
</html>
