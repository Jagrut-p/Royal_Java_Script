<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <title>Document</title>
    <style>
        body {
            background-color: aliceblue;
        }

        #n {
            font-size: 18px;
            border: 3px solid aliceblue;
            border-radius: 20px;
            margin: 20px;
        }

        #i {
            position: relative;
            right: 170px;
            bottom: 160px;
            color: red;
            font-size: 20px;
            opacity: 0;
        }

        #i2 {
            color: red;
            font-size: 20px;
        }

        .animate {
            animation-name: ani;
            animation-duration: 0.6s;
        }

        @keyframes ani {
            0% {
                opacity: 0;
                transform: scale(0);
            }

            100% {
                opacity: 0.6;
                transform: scale(10);
            }
        }
    </style>
</head>

<body>
    <center>
        <h2>Double Click On The Image To 
            <i  id="i2" class="fa fa-heart" aria-hidden="true"></i> it</h2>

        <h3>Like Counter : 0 Likes</h3>

        <div ondblclick="like()">
            <img src="S25.jpg">
            <i id="i" class="fa fa-heart" aria-hidden="true"></i>
        </div>

    </center>
    <script>

        var lc = 0;
        
        function like() 
        {
            document.getElementById("i").addEventListener("animationend",function()
            {
                document.getElementById("i").classList.remove("animate");
            });
            
            lc++;
            document.querySelector('h3').innerHTML = "Like Counter : " + lc + " Likes"
 
            document.getElementById("i").classList.add("animate")

        }

    </script>

</body>

</html>
