<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task</title>
    <style>

        div{
            border: 5px solid black;
            background-color: aqua;
        }

        .boxcss{
            width: 500px;
            background-color: orangered;
            color: aqua;
            text-align: justify;
            padding: 10px;
            border: 5px dashed black;
            border-radius: 10px;
            box-shadow: 5px 5px 5px black;
            margin: 20px;
        }

        #d1{
            width: 500px;
            padding: 10px;
            margin: 20px;
        }

    </style>
</head>

<body>
    <div id="d1">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Quae veritatis sapiente ipsum voluptatem quo neque
        reprehenderit, at eius beatae esse assumenda magni nulla inventore est commodi quod numquam incidunt illum?
    </div>

    <button onclick="check('add')">Add Css</button>
    <button onclick="check('remove')">Remove Css</button>
    <button onclick="check('toggle')">Toggle Css</button>
</body>
<script>
    function check(vari){
        if(vari=='add')
        {
            document.getElementById('d1').classList.add('boxcss')
        }else if(vari=='remove')
        {
            document.getElementById('d1').classList.remove('boxcss')
        }else
        {
            document.getElementById('d1').classList.toggle('boxcss')
        }
    }
</script>


</html>
