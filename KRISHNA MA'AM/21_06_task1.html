<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
</head>
<body>
    
<ul>
    <li id="css">Css<i class="fa fa-close" style="font-size:22px;color:red; padding: 0 30px;" onclick="rem('css')"></i></li>

    <li id="java">Java<i class="fa fa-close" style="font-size:22px;color:red; padding: 0 30px;" onclick="rem('java')"></i></li>
    <li id="pyt">Python<i class="fa fa-close" style="font-size:22px;color:red; padding: 0 30px;" onclick="rem('pyt')"></i></li>

</ul>

<script>
    function rem(vari)
    {
        document.getElementById(vari).remove()
    }
</script>

</body>
