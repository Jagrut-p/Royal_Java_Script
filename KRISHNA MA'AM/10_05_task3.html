<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="d1">
        BMI Calculator
    </div>

    <div>
        Enter Weight(kg):
        <br>
        <input type="text" id="i1">
    </div>
    <div>
        Enter Height(m):
        <br>
        <input type="text" id="i2">
    </div>
    <div>
        <input onclick="check()" type="button" value="Calculate BMI">
    </div>

    
    <div id="d2">

    </div>
    <script>
        function check()
        {
            var a=document.getElementById('i1').value
            var b=document.getElementById('i2').value

            var bmi=a/(b*b);
            document.getElementById('d2').innerHTML=bmi
        }
    </script>
</body>
</html>
