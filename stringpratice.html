<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let str = "Royal Technosoft Pvt Ltd"
        document.writeln('<br> Name: '+ str)
        document.writeln('<br> Name:' + str[0])
        document.writeln('<br> Name:' + str[1])
        document.writeln('<br> Name:' + str[2])
        document.writeln('<br>Length: '+str.length)

        document.writeln('<br>UpperCase: '+ str.toUpperCase())
        document.writeln('<br>LowerCase: '+ str.toLowerCase())
        document.writeln('<br>Include: '+ str.includes('Tech'))
        
    </script>
</body>
</html>
