<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #display {
        width: 450px;
        height: 50px;
        font-size: 40px;
        border-radius: 50%;
    }

    #img1 {
        border: 1px solid black;
        height: 200px;
        width: 200px;
    }

    .dis {
        font-size: 30px;
    }

    #head1 {
        background-color: rgb(47, 70, 43);
        height: 50px;
        color: white;
        margin: 0;
        padding: 0;
    }

    body {
        margin: 0%;
        padding: 0%;
    }
    #head1 h1{
        margin: 0;
    }
</style>

<body>
    <center id="head1">
        <h1>Rock Paper Scissors</h1>
    </center>
    <br><br>
    <center>
        <img onclick="launch('Paper')" id="img1" src="./WhatsApp Image 2026-05-17 at 2.28.22 PM (1).jpeg" alt="">
        <img onclick="launch('Rock')" id="img1" src="./WhatsApp Image 2026-05-17 at 2.28.22 PM.jpeg" alt="">
        <img onclick="launch('Sezier')" id="img1" src="./WhatsApp Image 2026-05-17 at 2.28.23 PM.jpeg" alt="">
        <br><br>
         <span class="dis" id="computer">Computer: </span>
         <span class="dis" id="user">User: </span><br><br><br><br><br><br>
        <div class="dis" id="display"></div>
    </center>
</body>
<script>

</script>
<script>
    let arr = ['Rock', 'Paper', 'Sezier']
    let w = 0
    let c = 0
    function launch(y) {
        let x = Math.floor(Math.random() * 3)
        if (y == arr[x]) {
            document.getElementById('display').innerHTML = "<div style='color:white; border-radius: 30px; background-color: green;'>" + "It's a Draw " + arr[x] + " vs " + y + "</div>";
        }
        else if (y == 'Rock' && arr[x] == 'Paper') {
            document.getElementById('display').innerHTML = "<div style='color:white; border-radius: 30px; background-color: green;'>" + "You Lose " + arr[x] + " vs " + y + "</div>";
            c++;
        }
        else if (y == 'Paper' && arr[x] == 'Sezier') {
            document.getElementById('display').innerHTML = "<div style='color:white; border-radius: 30px; background-color: green;'>" + "You Lose " + arr[x] + " vs " + y + "</div>";
            c++;
        }
        else if (y == 'Sizer' && arr[x] == 'Rock') {
            document.getElementById('display').innerHTML = "<div style='color:white; border-radius: 30px; background-color: green;'>" + "You Lose " + arr[x] + " vs " + y + "</div>";
            c++;
        }
        else {
            document.getElementById('display').innerHTML = "<div style='color:white; border-radius: 30px; background-color: green;'>" + "You Win " + arr[x] + " vs " + y + "</div>";
            w++;

        }
        console.log(arr[x])
        document.getElementById('computer').innerHTML = "Computer: " + c
        document.getElementById('user').innerHTML = "User: " + w
    }
</script>

</html>
