<!-- 5. find reverse Number of given number
    6. check number is palindrom or not
    7. check number is Armstrong or not -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        temp = 0
        rev = 0
        n = parseInt(prompt("Enter a number: "))
        check = n
        while(n>0)
    {
        temp = n % 10
        rev = (rev * 10 + temp)
        n = parseInt(n/10) 
    }
    if(check == rev)
    {
        document.writeln("Entered number is palindrom")
    }
    else
    {
        document.writeln("Entered number is not palindrom")
    }
    </script>
     
</body>
</html>
